<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 240px; padding: 16px; font-family: system-ui, sans-serif; }
  #value { font-size: 48px; font-weight: bold; }
  input { width: 100%; margin: 12px 0; }
  #status { font-size: 12px; color: gray; }
</style>
</head>
<body>
  <div id="value">100%</div>
  <input id="slider" type="range" min="0" max="600" step="5" value="100">
  <button id="reset">Reset</button>
  <p id="status">Move the slider to start</p>
  <script src="popup.js"></script>
</body>
</html>
