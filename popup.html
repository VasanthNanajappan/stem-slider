<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; padding: 16px; font-family: system-ui, sans-serif; }
  .label { display: flex; justify-content: space-between; font-size: 13px; color: gray; }
  .big { font-size: 40px; font-weight: bold; }
  input[type=range] { width: 100%; margin: 8px 0 4px; }
  .ends { display: flex; justify-content: space-between; font-size: 12px; color: gray; margin-bottom: 16px; }
  #status { font-size: 12px; color: gray; }
</style>
</head>
<body>
  <div class="label"><span>Volume</span></div>
  <div id="volumeValue" class="big">100%</div>
  <input id="volume" type="range" min="0" max="600" step="5" value="100">
  <div class="ends"><span>0%</span><span>600%</span></div>

  <div class="label"><span>Voice ↔ Music</span><span id="voiceValue">Neutral</span></div>
  <input id="voice" type="range" min="-100" max="100" step="5" value="0">
  <div class="ends"><span>Music</span><span>Voice</span></div>

  <button id="reset">Reset</button>
  <p id="status">Move a slider to start</p>
  <script src="popup.js"></script>
</body>
</html>
